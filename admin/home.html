<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photobooth Gallery</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/home.css">
</head>
<body>
    <div class="header">
        <img src="assets/Logo - Transparent RGB.png" alt="logo">
        <h1>Photobooth Gallery</h1>
    </div>
    <aside id="print-sidebar" class="expanded">
        <button id="sidebar-button" type="button" class="sidebar-toggle">
            <span id="print-badge" class="badge" hidden>0</span>
            <span class="toggle-icon">☰</span>
        </button>

        <div class="sidebar-body">
            <div class="sidebar-section">
                <div class="sidebar-title">Print Queue</div>
                <div id="queue-list" class="sidebar-list"></div>
            </div>
            <div class="sidebar-section">
                <div class="sidebar-title">History</div>
                <div id="history-list" class="sidebar-list"></div>
            </div>
        </div>

        <button id="logout-btn" type="button" class="logout-btn">
            <span class="logout-icon">⎋</span>
            <span class="logout-text">Logout</span>
        </button>
    </aside>
    <main class="app-content">
        <div class="home">
            <input class="search" placeholder="Search Session ID">

            <div class="session-grid">
                <div class="session-card">
                    <div class="thumb">slideshow</div>
                    <div class="session-id">#abcde</div>
                </div>
            </div>
        </div>
    </main>
    <div class="footer"></div>

    <script type="module" src="js/sidebar.js"></script>
    <script type="module" src="js/home.js"></script>
</body>
</html>
