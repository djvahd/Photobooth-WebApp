# Netlify menyajikan isi repo apa adanya (tanpa build).
[build]
  publish = "."
  command = ""

# Halaman utama → kiosk
[[redirects]]
  from = "/"
  to = "/kiosk/"
  status = 302

# Alamat lama (sebelum dipindah ke /kiosk) tetap jalan
[[redirects]]
  from = "/home.html"
  to = "/kiosk/"
  status = 301
[[redirects]]
  from = "/camera.html"
  to = "/kiosk/"
  status = 301
[[redirects]]
  from = "/preview.html"
  to = "/kiosk/"
  status = 301
[[redirects]]
  from = "/qr.html"
  to = "/kiosk/"
  status = 301

# Halaman kiosk lama (multi-halaman) → kiosk baru (satu halaman)
[[redirects]]
  from = "/kiosk/home.html"
  to = "/kiosk/"
  status = 301
[[redirects]]
  from = "/kiosk/camera.html"
  to = "/kiosk/"
  status = 301
[[redirects]]
  from = "/kiosk/preview.html"
  to = "/kiosk/"
  status = 301
[[redirects]]
  from = "/kiosk/qr.html"
  to = "/kiosk/"
  status = 301

# Admin
[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301
[[redirects]]
  from = "/admin/login.html"
  to = "/admin/"
  status = 301
[[redirects]]
  from = "/admin/home.html"
  to = "/admin/"
  status = 301
[[redirects]]
  from = "/admin/gallery.html"
  to = "/admin/"
  status = 301

# Jangan sajikan kode backend & file konfigurasi ke publik
[[redirects]]
  from = "/gas/*"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/.clasp.json"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/package.json"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/netlify.toml"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/docs/*"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/tests/*"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/vercel.json"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/.vercelignore"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/README.md"
  to = "/404"
  status = 404
  force = true
